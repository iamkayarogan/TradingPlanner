<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark rounded background -->
  <rect width="32" height="32" rx="7" fill="#0f172a"/>

  <!-- Candle 1 — green (up) -->
  <!-- Wick -->
  <line x1="8" y1="5" x2="8" y2="27" stroke="#10b981" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <!-- Body -->
  <rect x="5" y="10" width="6" height="10" rx="1" fill="#10b981"/>

  <!-- Candle 2 — red (down) -->
  <!-- Wick -->
  <line x1="16" y1="4" x2="16" y2="28" stroke="#ef4444" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <!-- Body -->
  <rect x="13" y="8" width="6" height="13" rx="1" fill="#ef4444"/>

  <!-- Candle 3 — green (up) -->
  <!-- Wick -->
  <line x1="24" y1="6" x2="24" y2="25" stroke="#10b981" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <!-- Body -->
  <rect x="21" y="11" width="6" height="9" rx="1" fill="#10b981"/>
</svg>
